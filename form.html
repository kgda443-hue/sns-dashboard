<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X数値入力</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; color: #1c1b18; }
  label { display: block; margin-top: 16px; font-size: 14px; color: #444; }
  input { width: 100%; padding: 10px; font-size: 16px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 24px; width: 100%; padding: 12px; font-size: 16px; background: #0e7c66; color: #fff; border: none; border-radius: 6px; }
  #msg { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<h1>Xの数値を入力</h1>
<p>analytics.twitter.com で確認した数値を入力してください。</p>
<form id="form">
  <label>日付<input type="date" id="date" required></label>
  <label>フォロワー数<input type="number" id="followers" required></label>
  <label>インプレッション数(任意)<input type="number" id="impressions"></label>
  <label>エンゲージメント率(%、任意)<input type="number" step="0.01" id="engagement"></label>
  <button type="submit">保存する</button>
</form>
<p id="msg"></p>

<script>
// ↓Supabaseプロジェクトの「Project URL」と「anon public」キーに書き換えてください
const SUPABASE_URL = 'https://zqahddjdeqolxnziznsu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B9-gSmahavvSi6ukjC6lfQ_N0J3P6ey';
const X_ACCOUNT_ID = 1; // schema.sqlの登録順どおりならXはid=1

document.getElementById('date').valueAsDate = new Date();

document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '保存しています...';

  const impressionsVal = document.getElementById('impressions').value;
  const engagementVal = document.getElementById('engagement').value;

  const row = {
    account_id: X_ACCOUNT_ID,
    date: document.getElementById('date').value,
    followers_count: Number(document.getElementById('followers').value),
    impressions: impressionsVal ? Number(impressionsVal) : null,
    engagement_rate: engagementVal ? Number(engagementVal) : null,
  };

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/daily_metrics?on_conflict=account_id,date', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        Prefer: 'resolution=merge-duplicates',
      },
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(await res.text());
    msg.textContent = '保存しました。';
  } catch (err) {
    msg.textContent = '保存に失敗しました。' + err.message;
  }
});
</script>
</body>
</html>
