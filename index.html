<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNSのびのび手帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6f91">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="のびのび手帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "M PLUS Rounded 1c", -apple-system, "Hiragino Sans", sans-serif;
    margin: 0;
    background: #fff6f3;
    color: #4a3f3c;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }
  header {
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 10px;
  }
  header h1 { font-size: 21px; margin: 0 0 2px; font-weight: 700; color: #3a2e2c; }
  header .sub { font-size: 12px; color: #a98d89; margin-bottom: 4px; }
  header .updated { font-size: 11px; color: #c2a9a5; }
  .view { padding: 4px 16px 16px; }
  .view[hidden] { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card {
    background: #fff;
    border: 1px solid #ffd9e3;
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 0 4px 14px rgba(255, 111, 145, 0.10);
  }
  .card .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .card .handle { font-size: 11px; color: #a98d89; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; color: #3a2e2c; }
  .card .delta { font-size: 12px; margin-top: 4px; font-weight: 500; color: #a98d89; }
  .card .delta.up { color: #3aa876; }
  .card .delta.down { color: #e06b7a; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #a98d89; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #chart-wrap {
    position: relative; height: 250px;
    background: #fff; border: 1px solid #ffd9e3; border-radius: 20px; padding: 16px;
    box-shadow: 0 4px 14px rgba(255, 111, 145, 0.10);
  }
  .empty { font-size: 13px; color: #a98d89; padding: 24px 0; text-align: center; }

  form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  label { font-size: 13px; color: #6b5551; font-weight: 500; display: flex; flex-direction: column; gap: 5px; }
  input, select {
    padding: 11px 12px; font-size: 16px;
    border: 1px solid #ffd9e3; border-radius: 12px; background: #fff;
    font-family: inherit; color: #3a2e2c;
  }
  button.primary {
    margin-top: 4px; padding: 13px; font-size: 15px; font-weight: 700;
    background: #ff6f91; color: #fff; border: none; border-radius: 14px;
    box-shadow: 0 4px 12px rgba(255, 111, 145, 0.35);
  }
  #msg { font-size: 13px; color: #a98d89; }

  nav.tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex; gap: 8px;
    background: #fff;
    border-top: 1px solid #ffe3e9;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  nav.tabbar button {
    flex: 1;
    border: none;
    background: none;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 500;
    color: #c2a9a5;
    border-radius: 14px;
  }
  nav.tabbar button .icon { display: block; font-size: 17px; margin-bottom: 2px; }
  nav.tabbar button.active { color: #ff6f91; background: #fff0f3; }
</style>
</head>
<body>

<header>
  <h1>SNSのびのび手帳</h1>
  <div class="sub">今日の伸び、のぞいてみよう</div>
  <div class="updated" id="updated">読み込み中...</div>
</header>

<section id="view-dashboard" class="view">
  <div class="kpis" id="kpis"></div>
  <div class="legend" id="legend"></div>
  <div id="chart-wrap">
    <canvas id="trendChart" role="img" aria-label="登録アカウントのフォロワー数推移"></canvas>
  </div>
</section>

<section id="view-input" class="view" hidden>
  <form id="form">
    <label>アカウント
      <select id="account" required></select>
    </label>
    <label>日付
      <input type="date" id="date" required>
    </label>
    <label>フォロワー数
      <input type="number" id="followers" required>
    </label>
    <label>インプレッション数(任意)
      <input type="number" id="impressions">
    </label>
    <label>エンゲージメント率(%、任意)
      <input type="number" step="0.01" id="engagement">
    </label>
    <button type="submit" class="primary">保存する</button>
  </form>
  <p id="msg"></p>
</section>

<nav class="tabbar">
  <button data-view="dashboard" class="tab active" id="tab-dashboard">
    <span class="icon">◕</span>ダッシュボード
  </button>
  <button data-view="input" class="tab" id="tab-input">
    <span class="icon">✎</span>数字を入力
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SUPABASE_URL = 'https://zqahddjdeqolxnziznsu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B9-gSmahavvSi6ukjC6lfQ_N0J3P6ey';
const DAYS = 30;
const PLATFORM_STYLE = {
  x: { label: 'X', color: '#5b9bd5' },
  instagram: { label: 'Instagram', color: '#e1306c' },
};
const FALLBACK_COLORS = ['#8e7cc3', '#f6b93b', '#3aa876'];

function platformInfo(p, i) {
  return PLATFORM_STYLE[p] || { label: p, color: FALLBACK_COLORS[i % FALLBACK_COLORS.length] };
}

async function sb(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbWrite(row) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/daily_metrics?on_conflict=account_id,date', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      Prefer: 'resolution=merge-duplicates',
    },
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(await res.text());
}

function switchView(name) {
  document.getElementById('view-dashboard').hidden = name !== 'dashboard';
  document.getElementById('view-input').hidden = name !== 'input';
  document.getElementById('tab-dashboard').classList.toggle('active', name === 'dashboard');
  document.getElementById('tab-input').classList.toggle('active', name === 'input');
}

document.getElementById('tab-dashboard').addEventListener('click', function () { switchView('dashboard'); });
document.getElementById('tab-input').addEventListener('click', function () { switchView('input'); });

function renderKpis(accounts, metricsByAccount) {
  const kpis = document.getElementById('kpis');
  if (accounts.length === 0) {
    kpis.innerHTML = '<div class="empty">登録されているアカウントがありません</div>';
    return;
  }
  kpis.innerHTML = accounts.map(function (acc, i) {
    const info = platformInfo(acc.platform, i);
    const rows = metricsByAccount[acc.id] || [];
    const latest = rows[rows.length - 1];
    const prev = rows[rows.length - 2];
    let deltaHtml = '';
    if (latest && prev) {
      const diff = latest.followers_count - prev.followers_count;
      const cls = diff > 0 ? ' up' : diff < 0 ? ' down' : '';
      const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
      const sign = diff > 0 ? '+' : '';
      deltaHtml = '<div class="delta' + cls + '">' + arrow + ' ' + sign + diff.toLocaleString() + '(前回比)</div>';
    }
    return '<div class="card">' +
      '<span class="badge" style="background:' + info.color + '">' + info.label + '</span>' +
      '<div class="handle">' + acc.handle + '</div>' +
      '<div class="value">' + (latest ? latest.followers_count.toLocaleString() : '-') + '<span style="font-size:12px;font-weight:500;color:#a98d89;"> 人</span></div>' +
      deltaHtml +
      '</div>';
  }).join('');
}

function renderLegend(accounts) {
  const legend = document.getElementById('legend');
  legend.innerHTML = accounts.map(function (acc, i) {
    const info = platformInfo(acc.platform, i);
    return '<span><span class="dot" style="background:' + info.color + '"></span>' + info.label + ' · ' + acc.handle + '</span>';
  }).join('');
}

let chartInstance = null;
function renderChart(accounts, metricsByAccount) {
  const allDates = new Set();
  accounts.forEach(function (acc) {
    (metricsByAccount[acc.id] || []).forEach(function (r) { allDates.add(r.date); });
  });
  const labels = Array.from(allDates).sort();

  const datasets = accounts.map(function (acc, i) {
    const info = platformInfo(acc.platform, i);
    const map = {};
    (metricsByAccount[acc.id] || []).forEach(function (r) { map[r.date] = r.followers_count; });
    return {
      label: info.label + ' · ' + acc.handle,
      data: labels.map(function (d) { return map[d] ?? null; }),
      borderColor: info.color,
      backgroundColor: info.color + '22',
      fill: true,
      spanGaps: true,
      tension: 0.35,
      pointRadius: 4,
      pointBackgroundColor: '#fff',
      pointBorderColor: info.color,
      pointBorderWidth: 2,
      borderWidth: 3,
    };
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#fff0f3' } },
      },
    },
  });
}

function populateAccountSelect(accounts) {
  const select = document.getElementById('account');
  const manual = accounts.filter(function (a) { return a.data_source === 'manual'; });
  if (manual.length === 0) {
    select.innerHTML = '<option value="">手動入力のアカウントがありません</option>';
    return;
  }
  select.innerHTML = manual.map(function (a, i) {
    const info = platformInfo(a.platform, i);
    return '<option value="' + a.id + '">' + info.label + ' · ' + a.handle + '</option>';
  }).join('');
}

async function loadDashboard() {
  const updated = document.getElementById('updated');
  try {
    const accounts = await sb('accounts?order=id.asc');
    const since = new Date(Date.now() - DAYS * 86400000).toISOString().slice(0, 10);
    const metricsByAccount = {};
    await Promise.all(accounts.map(async function (acc) {
      metricsByAccount[acc.id] = await sb('daily_metrics?account_id=eq.' + acc.id + '&date=gte.' + since + '&order=date.asc');
    }));

    renderKpis(accounts, metricsByAccount);
    renderLegend(accounts);
    renderChart(accounts, metricsByAccount);
    populateAccountSelect(accounts);
    updated.textContent = '最終更新: ' + new Date().toLocaleString('ja-JP');
  } catch (err) {
    updated.textContent = 'データの読み込みに失敗しました: ' + err.message;
  }
}

document.getElementById('date').valueAsDate = new Date();

document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const accountId = document.getElementById('account').value;
  if (!accountId) {
    msg.textContent = 'アカウントを選択してください。';
    return;
  }
  msg.textContent = '保存しています...';

  const impressionsVal = document.getElementById('impressions').value;
  const engagementVal = document.getElementById('engagement').value;

  const row = {
    account_id: Number(accountId),
    date: document.getElementById('date').value,
    followers_count: Number(document.getElementById('followers').value),
    impressions: impressionsVal ? Number(impressionsVal) : null,
    engagement_rate: engagementVal ? Number(engagementVal) : null,
  };

  try {
    await sbWrite(row);
    msg.textContent = '保存しました。よくがんばりました!';
    loadDashboard();
  } catch (err) {
    msg.textContent = '保存に失敗しました。' + err.message;
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

loadDashboard();
</script>
</body>
</html>
