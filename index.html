<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNSのびのび手帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6f91">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="のびのび手帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "M PLUS Rounded 1c", -apple-system, "Hiragino Sans", sans-serif;
    margin: 0;
    background: #fff6f3;
    color: #4a3f3c;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }
  header {
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 10px;
  }
  header h1 { font-size: 21px; margin: 0 0 2px; font-weight: 700; color: #3a2e2c; }
  header .sub { font-size: 12px; color: #a98d89; margin-bottom: 4px; }
  header .updated { font-size: 11px; color: #c2a9a5; }
  .view { padding: 4px 16px 16px; }
  .view[hidden] { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card {
    background: #fff;
    border: 1px solid #ffd9e3;
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 0 4px 14px rgba(255, 111, 145, 0.10);
  }
  .card .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .card .handle { font-size: 11px; color: #a98d89; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; color: #3a2e2c; }
  .card .delta { font-size: 12px; margin-top: 4px; font-weight: 500; color: #a98d89; }
  .card .delta.up { color: #3aa876; }
  .card .delta.down { color: #e06b7a; }

  .section-title { font-size: 13px; font-weight: 700; color: #6b5551; margin: 4px 0 10px; }
  .account-chart-card {
    background: #fff; border: 1px solid #ffd9e3; border-radius: 20px;
    padding: 16px 16px 6px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(255, 111, 145, 0.10);
  }
  .account-chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .account-chart-head .who { display: flex; align-items: center; gap: 8px; }
  .account-chart-head .badge {
    font-size: 11px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 999px;
  }
  .account-chart-head .handle { font-size: 12px; color: #a98d89; }
  .account-chart-head .latest { font-size: 16px; font-weight: 700; color: #3a2e2c; }
  .mini-chart-wrap { position: relative; height: 170px; }
  .stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
  .stat-chip { background: #fff6f3; border-radius: 10px; padding: 6px 10px; font-size: 11px; color: #6b5551; }
  .stat-chip b { color: #3a2e2c; font-size: 12px; }
  .empty { font-size: 13px; color: #a98d89; padding: 24px 0; text-align: center; }

  form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  label { font-size: 13px; color: #6b5551; font-weight: 500; display: flex; flex-direction: column; gap: 5px; }
  input, select {
    padding: 11px 12px; font-size: 16px;
    border: 1px solid #ffd9e3; border-radius: 12px; background: #fff;
    font-family: inherit; color: #3a2e2c;
  }
  button.primary {
    margin-top: 4px; padding: 13px; font-size: 15px; font-weight: 700;
    background: #ff6f91; color: #fff; border: none; border-radius: 14px;
    box-shadow: 0 4px 12px rgba(255, 111, 145, 0.35);
  }
  #msg { font-size: 13px; color: #a98d89; }

  nav.tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex; gap: 8px;
    background: #fff;
    border-top: 1px solid #ffe3e9;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  nav.tabbar button {
    flex: 1;
    border: none;
    background: none;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 500;
    color: #c2a9a5;
    border-radius: 14px;
  }
  nav.tabbar button .icon { display: block; font-size: 17px; margin-bottom: 2px; }
  nav.tabbar button.active { color: #ff6f91; background: #fff0f3; }

  /* リサーチ */
  .comp-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .comp-row {
    background: #fff; border: 1px solid #ffd9e3; border-radius: 16px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
  }
  .comp-row .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .comp-row .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .comp-row .num { font-size: 17px; font-weight: 700; text-align: right; }
  .comp-row .meta { grid-column: 1 / -1; font-size: 11px; color: #a98d89; }
  .pill { font-size: 10px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button {
    border: 1px solid #ffd9e3; background: #fff; color: #6b5551; font-family: inherit;
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
  }
  .filters button.active { background: #ff6f91; border-color: #ff6f91; color: #fff; }
  .post-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .post {
    background: #fff; border: 1px solid #ffd9e3; border-radius: 16px; padding: 12px 14px;
    text-decoration: none; color: inherit; display: block;
  }
  .post .top { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #a98d89; margin-bottom: 6px; flex-wrap: wrap; }
  .post .text { font-size: 13px; line-height: 1.6; color: #3a2e2c; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .post .nums { font-size: 12px; color: #6b5551; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .post .nums b { color: #3a2e2c; }
  .target-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .target {
    display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ffd9e3;
    border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px;
  }
  .target button { border: none; background: #fff0f3; color: #e06b7a; border-radius: 999px; width: 22px; height: 22px; font-size: 12px; }
  .add-target { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add-target input { grid-column: 1 / -1; }
  .add-target button { grid-column: 1 / -1; }
  .hint { font-size: 11px; color: #a98d89; line-height: 1.6; margin: 6px 0 14px; }
</style>
</head>
<body>

<header>
  <h1>SNSのびのび手帳</h1>
  <div class="sub">今日の伸び、のぞいてみよう</div>
  <div class="updated" id="updated">読み込み中...</div>
</header>

<section id="view-dashboard" class="view">
  <div class="kpis" id="kpis"></div>
  <div class="section-title">アカウントごとのグラフ</div>
  <div id="account-charts"></div>
</section>

<section id="view-input" class="view" hidden>
  <form id="form">
    <label>アカウント
      <select id="account" required></select>
    </label>
    <label>日付
      <input type="date" id="date" required>
    </label>
    <label>フォロワー数
      <input type="number" id="followers" required>
    </label>
    <label>インプレッション数(任意)
      <input type="number" id="impressions">
    </label>
    <label>エンゲージメント率(%、任意)
      <input type="number" step="0.01" id="engagement">
    </label>
    <button type="submit" class="primary">保存する</button>
  </form>
  <p id="msg"></p>
</section>

<section id="view-research" class="view" hidden>
  <div class="section-title">競合アカウント(7日前との比較)</div>
  <div class="comp-list" id="comp-list"></div>

  <div class="section-title">集めた投稿</div>
  <div class="filters" id="post-filters">
    <button data-p="all" class="active">すべて</button>
    <button data-p="instagram">Instagram</button>
    <button data-p="threads">Threads</button>
    <button data-p="tiktok">TikTok</button>
  </div>
  <div class="filters" id="post-sorts">
    <button data-s="new" class="active">新しく集めた順</button>
    <button data-s="likes">いいね順</button>
    <button data-s="views">再生数順</button>
  </div>
  <div class="post-list" id="post-list"></div>

  <div class="section-title">調べる対象</div>
  <div class="target-list" id="target-list"></div>
  <form class="add-target" id="target-form">
    <select id="t-platform">
      <option value="instagram">Instagram</option>
      <option value="threads">Threads</option>
      <option value="tiktok">TikTok</option>
    </select>
    <select id="t-kind">
      <option value="account">競合アカウント</option>
      <option value="keyword">キーワード</option>
      <option value="hashtag">ハッシュタグ</option>
    </select>
    <input id="t-value" placeholder="例: アカウント名 / 社会人 学び直し / #朝活" required>
    <button type="submit" class="primary">追加する</button>
  </form>
  <p class="hint" id="target-msg">
    Instagram: 競合アカウント(ビジネス/クリエイターのみ)・ハッシュタグ(週30個まで)<br>
    Threads: キーワード・競合アカウント<br>
    TikTok: キーワード(毎週月曜にまとめて収集。月の無料枠の関係で2〜3個まで)
  </p>
</section>

<nav class="tabbar">
  <button data-view="dashboard" class="tab active" id="tab-dashboard">
    <span class="icon">◕</span>ダッシュボード
  </button>
  <button data-view="input" class="tab" id="tab-input">
    <span class="icon">✎</span>数字を入力
  </button>
  <button data-view="research" class="tab" id="tab-research">
    <span class="icon">⌕</span>リサーチ
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SUPABASE_URL = 'https://zqahddjdeqolxnziznsu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B9-gSmahavvSi6ukjC6lfQ_N0J3P6ey';
const DAYS = 30;
const PLATFORM_STYLE = {
  x: { label: 'X', color: '#5b9bd5' },
  instagram: { label: 'Instagram', color: '#e1306c' },
  threads: { label: 'Threads', color: '#3a3a3a' },
  tiktok: { label: 'TikTok', color: '#25b5b0' },
};
const FALLBACK_COLORS = ['#8e7cc3', '#f6b93b', '#3aa876'];

function platformInfo(p, i) {
  return PLATFORM_STYLE[p] || { label: p, color: FALLBACK_COLORS[i % FALLBACK_COLORS.length] };
}

async function sb(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbWrite(row) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/daily_metrics?on_conflict=account_id,date', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      Prefer: 'resolution=merge-duplicates',
    },
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(await res.text());
}

const VIEWS = ['dashboard', 'input', 'research'];
let researchLoaded = false;
function switchView(name) {
  VIEWS.forEach(function (v) {
    document.getElementById('view-' + v).hidden = name !== v;
    document.getElementById('tab-' + v).classList.toggle('active', name === v);
  });
  if (name === 'research' && !researchLoaded) {
    researchLoaded = true;
    loadResearch();
  }
}

VIEWS.forEach(function (v) {
  document.getElementById('tab-' + v).addEventListener('click', function () { switchView(v); });
});

function renderKpis(accounts, metricsByAccount) {
  const kpis = document.getElementById('kpis');
  if (accounts.length === 0) {
    kpis.innerHTML = '<div class="empty">登録されているアカウントがありません</div>';
    return;
  }
  kpis.innerHTML = accounts.map(function (acc, i) {
    const info = platformInfo(acc.platform, i);
    const rows = metricsByAccount[acc.id] || [];
    const latest = rows[rows.length - 1];
    const prev = rows[rows.length - 2];
    let deltaHtml = '';
    if (latest && prev) {
      const diff = latest.followers_count - prev.followers_count;
      const cls = diff > 0 ? ' up' : diff < 0 ? ' down' : '';
      const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
      const sign = diff > 0 ? '+' : '';
      deltaHtml = '<div class="delta' + cls + '">' + arrow + ' ' + sign + diff.toLocaleString() + '(前回比)</div>';
    }
    return '<div class="card">' +
      '<span class="badge" style="background:' + info.color + '">' + info.label + '</span>' +
      '<div class="handle">' + acc.handle + '</div>' +
      '<div class="value">' + (latest ? latest.followers_count.toLocaleString() : '-') + '<span style="font-size:12px;font-weight:500;color:#a98d89;"> 人</span></div>' +
      deltaHtml +
      '</div>';
  }).join('');
}

const METRIC_LABELS = {
  impressions: 'インプレッション',
  reach: 'リーチ',
  engagement_rate: 'エンゲージメント率',
  avg_likes: '平均いいね',
  saves: '保存数',
};

const chartInstances = {};
function renderAccountCharts(accounts, metricsByAccount) {
  const wrap = document.getElementById('account-charts');
  if (accounts.length === 0) {
    wrap.innerHTML = '<div class="empty">登録されているアカウントがありません</div>';
    return;
  }

  wrap.innerHTML = accounts.map(function (acc) {
    return '<div class="account-chart-card" data-account-id="' + acc.id + '">' +
      '<div class="account-chart-head">' +
      '<div class="who"><span class="badge" style="background:' + platformInfo(acc.platform, 0).color + '">' +
      platformInfo(acc.platform, 0).label + '</span><span class="handle">' + acc.handle + '</span></div>' +
      '<div class="latest" id="latest-' + acc.id + '"></div>' +
      '</div>' +
      '<div class="mini-chart-wrap"><canvas id="chart-' + acc.id + '"></canvas></div>' +
      '<div class="stats-row" id="stats-' + acc.id + '"></div>' +
      '</div>';
  }).join('');

  accounts.forEach(function (acc) {
    const info = platformInfo(acc.platform, 0);
    const rows = metricsByAccount[acc.id] || [];
    const latest = rows[rows.length - 1];

    document.getElementById('latest-' + acc.id).textContent =
      latest ? latest.followers_count.toLocaleString() + '人' : 'データなし';

    const statsEl = document.getElementById('stats-' + acc.id);
    if (latest) {
      const chips = Object.keys(METRIC_LABELS)
        .filter(function (key) { return latest[key] !== null && latest[key] !== undefined; })
        .map(function (key) {
          const suffix = key === 'engagement_rate' ? '%' : '';
          return '<span class="stat-chip">' + METRIC_LABELS[key] + ' <b>' + latest[key] + suffix + '</b></span>';
        });
      statsEl.innerHTML = chips.join('');
    } else {
      statsEl.innerHTML = '';
    }

    const labels = rows.map(function (r) { return r.date; });
    const data = rows.map(function (r) { return r.followers_count; });

    if (chartInstances[acc.id]) chartInstances[acc.id].destroy();
    chartInstances[acc.id] = new Chart(document.getElementById('chart-' + acc.id), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          borderColor: info.color,
          backgroundColor: info.color + '22',
          fill: true,
          tension: 0.35,
          pointRadius: 4,
          pointBackgroundColor: '#fff',
          pointBorderColor: info.color,
          pointBorderWidth: 2,
          borderWidth: 3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { color: '#fff0f3' } },
        },
      },
    });
  });
}

function populateAccountSelect(accounts) {
  const select = document.getElementById('account');
  const manual = accounts.filter(function (a) { return a.data_source === 'manual'; });
  if (manual.length === 0) {
    select.innerHTML = '<option value="">手動入力のアカウントがありません</option>';
    return;
  }
  select.innerHTML = manual.map(function (a, i) {
    const info = platformInfo(a.platform, i);
    return '<option value="' + a.id + '">' + info.label + ' · ' + a.handle + '</option>';
  }).join('');
}

async function loadDashboard() {
  const updated = document.getElementById('updated');
  try {
    const accounts = await sb('accounts?order=id.asc');
    const since = new Date(Date.now() - DAYS * 86400000).toISOString().slice(0, 10);
    const metricsByAccount = {};
    await Promise.all(accounts.map(async function (acc) {
      metricsByAccount[acc.id] = await sb('daily_metrics?account_id=eq.' + acc.id + '&date=gte.' + since + '&order=date.asc');
    }));

    renderKpis(accounts, metricsByAccount);
    renderAccountCharts(accounts, metricsByAccount);
    populateAccountSelect(accounts);
    updated.textContent = '最終更新: ' + new Date().toLocaleString('ja-JP');
  } catch (err) {
    updated.textContent = 'データの読み込みに失敗しました: ' + err.message;
  }
}

document.getElementById('date').valueAsDate = new Date();

document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const accountId = document.getElementById('account').value;
  if (!accountId) {
    msg.textContent = 'アカウントを選択してください。';
    return;
  }
  msg.textContent = '保存しています...';

  const impressionsVal = document.getElementById('impressions').value;
  const engagementVal = document.getElementById('engagement').value;

  const row = {
    account_id: Number(accountId),
    date: document.getElementById('date').value,
    followers_count: Number(document.getElementById('followers').value),
    impressions: impressionsVal ? Number(impressionsVal) : null,
    engagement_rate: engagementVal ? Number(engagementVal) : null,
  };

  try {
    await sbWrite(row);
    msg.textContent = '保存しました。よくがんばりました!';
    loadDashboard();
  } catch (err) {
    msg.textContent = '保存に失敗しました。' + err.message;
  }
});

// ---------- リサーチ ----------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(n) {
  if (n === null || n === undefined) return '-';
  n = Number(n);
  if (n >= 10000) return (Math.round(n / 1000) / 10) + '万';
  return n.toLocaleString();
}
function pill(platform) {
  const info = platformInfo(platform, 0);
  return '<span class="pill" style="background:' + info.color + '">' + info.label + '</span>';
}
function safeUrl(u) {
  return /^https:\/\//.test(u || '') ? u : '#';
}

async function sbSend(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: method,
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
}

let allPosts = [];
let postFilter = 'all';
let postSort = 'new';
const KIND_LABEL = { account: '競合', keyword: 'キーワード', hashtag: 'ハッシュタグ' };
const SOURCE_LABEL = { competitor: '競合の投稿', keyword: 'キーワード', hashtag: 'ハッシュタグ', outlier: 'バズ投稿' };

function renderCompetitors(rows) {
  const el = document.getElementById('comp-list');
  const byKey = {};
  rows.forEach(function (r) {
    const k = r.platform + ':' + r.handle;
    (byKey[k] = byKey[k] || []).push(r);
  });
  const keys = Object.keys(byKey);
  if (keys.length === 0) {
    el.innerHTML = '<div class="empty">まだデータがありません。下の「調べる対象」に競合を追加すると、翌朝から記録されます。</div>';
    return;
  }
  el.innerHTML = keys.map(function (k) {
    const list = byKey[k]; // 日付の昇順
    const latest = list[list.length - 1];
    const weekAgo = new Date(new Date(latest.date).getTime() - 7 * 86400000).toISOString().slice(0, 10);
    const base = list.filter(function (r) { return r.date <= weekAgo; }).pop() || list[0];
    let delta = '';
    if (base !== latest && latest.followers_count != null && base.followers_count != null) {
      const d = latest.followers_count - base.followers_count;
      delta = ' ・ ' + (d >= 0 ? '+' : '') + d.toLocaleString() + '人(' + base.date.slice(5) + '比)';
    }
    const extra = [];
    if (latest.avg_likes != null) extra.push('平均いいね ' + fmt(latest.avg_likes));
    if (latest.avg_comments != null) extra.push('平均コメント ' + fmt(latest.avg_comments));
    if (latest.media_count != null) extra.push('投稿 ' + fmt(latest.media_count));
    return '<div class="comp-row">' +
      '<div class="who">' + pill(latest.platform) + '<span>@' + esc(latest.handle) + '</span></div>' +
      '<div class="num">' + fmt(latest.followers_count) + '<span style="font-size:11px;color:#a98d89;font-weight:500"> 人</span></div>' +
      '<div class="meta">' + esc(extra.join(' ・ ')) + esc(delta) + '</div>' +
      '</div>';
  }).join('');
}

function renderPosts() {
  const el = document.getElementById('post-list');
  let list = allPosts.filter(function (p) { return postFilter === 'all' || p.platform === postFilter; });
  const num = function (v) { return v == null ? -1 : Number(v); };
  if (postSort === 'likes') list = list.slice().sort(function (a, b) { return num(b.like_count) - num(a.like_count); });
  if (postSort === 'views') list = list.slice().sort(function (a, b) { return num(b.view_count) - num(a.view_count); });
  list = list.slice(0, 60);
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">まだ集めた投稿がありません</div>';
    return;
  }
  el.innerHTML = list.map(function (p) {
    const nums = [];
    if (p.view_count != null) nums.push('再生 <b>' + fmt(p.view_count) + '</b>');
    if (p.like_count != null) nums.push('いいね <b>' + fmt(p.like_count) + '</b>');
    if (p.comment_count != null) nums.push('コメント <b>' + fmt(p.comment_count) + '</b>');
    if (p.score != null) nums.push('普段の <b>' + (Math.round(p.score * 10) / 10) + '倍</b>');
    return '<a class="post" href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener">' +
      '<div class="top">' + pill(p.platform) +
      '<span>' + esc(SOURCE_LABEL[p.source] || p.source) + (p.query ? ':' + esc(p.query) : '') + '</span>' +
      (p.author ? '<span>@' + esc(p.author) + '</span>' : '') +
      (p.posted_at ? '<span>' + esc(p.posted_at.slice(0, 10)) + '</span>' : '') +
      '</div>' +
      '<div class="text">' + esc(p.caption || '(本文なし)') + '</div>' +
      (nums.length ? '<div class="nums">' + nums.join('') + '</div>' : '') +
      '</a>';
  }).join('');
}

function renderTargets(targets) {
  const el = document.getElementById('target-list');
  if (targets.length === 0) {
    el.innerHTML = '<div class="hint">まだ登録がありません</div>';
    return;
  }
  el.innerHTML = targets.map(function (t) {
    return '<span class="target">' + pill(t.platform) + esc(KIND_LABEL[t.kind] + ':' + t.value) +
      '<button data-id="' + t.id + '" aria-label="削除">✕</button></span>';
  }).join('');
}

async function loadResearch() {
  try {
    const since = new Date(Date.now() - 45 * 86400000).toISOString().slice(0, 10);
    const results = await Promise.all([
      sb('competitor_metrics?date=gte.' + since + '&order=date.asc'),
      sb('trend_posts?order=collected_on.desc,like_count.desc.nullslast&limit=300'),
      sb('research_targets?order=platform.asc,id.asc'),
    ]);
    renderCompetitors(results[0]);
    allPosts = results[1];
    renderPosts();
    renderTargets(results[2]);
  } catch (err) {
    document.getElementById('comp-list').innerHTML =
      '<div class="empty">リサーチデータを読み込めませんでした: ' + esc(err.message) + '</div>';
  }
}

document.getElementById('post-filters').addEventListener('click', function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  postFilter = b.dataset.p;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
  renderPosts();
});
document.getElementById('post-sorts').addEventListener('click', function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  postSort = b.dataset.s;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
  renderPosts();
});

document.getElementById('target-list').addEventListener('click', async function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    await sbSend('DELETE', 'research_targets?id=eq.' + Number(b.dataset.id));
    loadResearch();
  } catch (err) {
    document.getElementById('target-msg').textContent = '削除に失敗しました: ' + err.message;
  }
});

document.getElementById('target-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const platform = document.getElementById('t-platform').value;
  const kind = document.getElementById('t-kind').value;
  let value = document.getElementById('t-value').value.trim();
  const msg = document.getElementById('target-msg');
  if (kind === 'hashtag' && platform !== 'instagram') {
    msg.textContent = 'ハッシュタグはInstagramだけ対応しています。';
    return;
  }
  if (platform === 'tiktok' && kind !== 'keyword') {
    msg.textContent = 'TikTokは無料で使える方法の都合で、キーワードだけ対応しています。';
    return;
  }
  if (kind === 'account') value = value.replace(/^@/, '');
  if (kind === 'hashtag') value = value.replace(/^#/, '');
  if (!value) return;
  try {
    await sbSend('POST', 'research_targets', { platform: platform, kind: kind, value: value });
    document.getElementById('t-value').value = '';
    msg.textContent = '追加しました。次の自動取得(毎朝8時)から集め始めます。';
    loadResearch();
  } catch (err) {
    msg.textContent = '追加に失敗しました: ' + err.message;
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

loadDashboard();
</script>
</body>
</html>
