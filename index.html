<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNS Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7c66">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SNS">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    margin: 0;
    background: #faf9f5;
    color: #1c1b18;
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }
  header {
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 8px;
  }
  header h1 { font-size: 19px; margin: 0 0 2px; }
  header .updated { font-size: 12px; color: #6b675c; }
  .view { padding: 0 16px 16px; }
  .view[hidden] { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e4e1d6; border-radius: 12px; padding: 14px 16px; }
  .card .label { font-size: 12px; color: #6b675c; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .card .delta { font-size: 12px; margin-top: 2px; color: #6b675c; }
  .card .delta.up { color: #0e7c66; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #6b675c; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #chart-wrap { position: relative; height: 260px; background: #fff; border: 1px solid #e4e1d6; border-radius: 12px; padding: 16px; }
  .empty { font-size: 13px; color: #6b675c; padding: 24px 0; text-align: center; }

  form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  label { font-size: 13px; color: #444; display: flex; flex-direction: column; gap: 4px; }
  input, select { padding: 10px; font-size: 16px; border: 1px solid #e4e1d6; border-radius: 8px; background: #fff; }
  button.primary { margin-top: 4px; padding: 12px; font-size: 16px; background: #0e7c66; color: #fff; border: none; border-radius: 8px; }
  #msg { font-size: 13px; color: #6b675c; }

  nav.tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: #fff;
    border-top: 1px solid #e4e1d6;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabbar button {
    flex: 1;
    border: none;
    background: none;
    padding: 10px 0 8px;
    font-size: 12px;
    color: #9b968a;
  }
  nav.tabbar button .icon { display: block; font-size: 18px; margin-bottom: 2px; }
  nav.tabbar button.active { color: #0e7c66; }
</style>
</head>
<body>

<header>
  <h1>SNS Dashboard</h1>
  <div class="updated" id="updated">読み込み中...</div>
</header>

<section id="view-dashboard" class="view">
  <div class="kpis" id="kpis"></div>
  <div class="legend" id="legend"></div>
  <div id="chart-wrap">
    <canvas id="trendChart" role="img" aria-label="登録アカウントのフォロワー数推移"></canvas>
  </div>
</section>

<section id="view-input" class="view" hidden>
  <form id="form">
    <label>アカウント
      <select id="account" required></select>
    </label>
    <label>日付
      <input type="date" id="date" required>
    </label>
    <label>フォロワー数
      <input type="number" id="followers" required>
    </label>
    <label>インプレッション数(任意)
      <input type="number" id="impressions">
    </label>
    <label>エンゲージメント率(%、任意)
      <input type="number" step="0.01" id="engagement">
    </label>
    <button type="submit" class="primary">保存する</button>
  </form>
  <p id="msg"></p>
</section>

<nav class="tabbar">
  <button data-view="dashboard" class="tab active" id="tab-dashboard">
    <span class="icon">▤</span>ダッシュボード
  </button>
  <button data-view="input" class="tab" id="tab-input">
    <span class="icon">✎</span>入力
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SUPABASE_URL = 'https://zqahddjdeqolxnziznsu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B9-gSmahavvSi6ukjC6lfQ_N0J3P6ey';
const DAYS = 30;
const COLORS = ['#2a78d6', '#eb6834', '#639922', '#993556', '#854f0b'];

function platformLabel(p) {
  if (p === 'x') return 'X';
  if (p === 'instagram') return 'Instagram';
  return p;
}

async function sb(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbWrite(row) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/daily_metrics?on_conflict=account_id,date', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      Prefer: 'resolution=merge-duplicates',
    },
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(await res.text());
}

function switchView(name) {
  document.getElementById('view-dashboard').hidden = name !== 'dashboard';
  document.getElementById('view-input').hidden = name !== 'input';
  document.getElementById('tab-dashboard').classList.toggle('active', name === 'dashboard');
  document.getElementById('tab-input').classList.toggle('active', name === 'input');
}

document.getElementById('tab-dashboard').addEventListener('click', function () { switchView('dashboard'); });
document.getElementById('tab-input').addEventListener('click', function () { switchView('input'); });

function renderKpis(accounts, metricsByAccount) {
  const kpis = document.getElementById('kpis');
  if (accounts.length === 0) {
    kpis.innerHTML = '<div class="empty">登録されているアカウントがありません</div>';
    return;
  }
  kpis.innerHTML = accounts.map(function (acc) {
    const rows = metricsByAccount[acc.id] || [];
    const latest = rows[rows.length - 1];
    const prev = rows[rows.length - 2];
    let deltaHtml = '';
    if (latest && prev) {
      const diff = latest.followers_count - prev.followers_count;
      const sign = diff > 0 ? '+' : '';
      deltaHtml = '<div class="delta' + (diff > 0 ? ' up' : '') + '">' + sign + diff.toLocaleString() + '</div>';
    }
    return '<div class="card">' +
      '<div class="label">' + platformLabel(acc.platform) + ' · ' + acc.handle + '</div>' +
      '<div class="value">' + (latest ? latest.followers_count.toLocaleString() : '-') + '</div>' +
      deltaHtml +
      '</div>';
  }).join('');
}

function renderLegend(accounts) {
  const legend = document.getElementById('legend');
  legend.innerHTML = accounts.map(function (acc, i) {
    const color = COLORS[i % COLORS.length];
    return '<span><span class="dot" style="background:' + color + '"></span>' + platformLabel(acc.platform) + ' · ' + acc.handle + '</span>';
  }).join('');
}

let chartInstance = null;
function renderChart(accounts, metricsByAccount) {
  const allDates = new Set();
  accounts.forEach(function (acc) {
    (metricsByAccount[acc.id] || []).forEach(function (r) { allDates.add(r.date); });
  });
  const labels = Array.from(allDates).sort();

  const datasets = accounts.map(function (acc, i) {
    const map = {};
    (metricsByAccount[acc.id] || []).forEach(function (r) { map[r.date] = r.followers_count; });
    return {
      label: platformLabel(acc.platform) + ' · ' + acc.handle,
      data: labels.map(function (d) { return map[d] ?? null; }),
      borderColor: COLORS[i % COLORS.length],
      spanGaps: true,
      tension: 0.3,
    };
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
    },
  });
}

function populateAccountSelect(accounts) {
  const select = document.getElementById('account');
  const manual = accounts.filter(function (a) { return a.data_source === 'manual'; });
  if (manual.length === 0) {
    select.innerHTML = '<option value="">手動入力のアカウントがありません</option>';
    return;
  }
  select.innerHTML = manual.map(function (a) {
    return '<option value="' + a.id + '">' + platformLabel(a.platform) + ' · ' + a.handle + '</option>';
  }).join('');
}

async function loadDashboard() {
  const updated = document.getElementById('updated');
  try {
    const accounts = await sb('accounts?order=id.asc');
    const since = new Date(Date.now() - DAYS * 86400000).toISOString().slice(0, 10);
    const metricsByAccount = {};
    await Promise.all(accounts.map(async function (acc) {
      metricsByAccount[acc.id] = await sb('daily_metrics?account_id=eq.' + acc.id + '&date=gte.' + since + '&order=date.asc');
    }));

    renderKpis(accounts, metricsByAccount);
    renderLegend(accounts);
    renderChart(accounts, metricsByAccount);
    populateAccountSelect(accounts);
    updated.textContent = '最終更新: ' + new Date().toLocaleString('ja-JP');
  } catch (err) {
    updated.textContent = 'データの読み込みに失敗しました: ' + err.message;
  }
}

document.getElementById('date').valueAsDate = new Date();

document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const accountId = document.getElementById('account').value;
  if (!accountId) {
    msg.textContent = 'アカウントを選択してください。';
    return;
  }
  msg.textContent = '保存しています...';

  const impressionsVal = document.getElementById('impressions').value;
  const engagementVal = document.getElementById('engagement').value;

  const row = {
    account_id: Number(accountId),
    date: document.getElementById('date').value,
    followers_count: Number(document.getElementById('followers').value),
    impressions: impressionsVal ? Number(impressionsVal) : null,
    engagement_rate: engagementVal ? Number(engagementVal) : null,
  };

  try {
    await sbWrite(row);
    msg.textContent = '保存しました。';
    loadDashboard();
  } catch (err) {
    msg.textContent = '保存に失敗しました。' + err.message;
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

loadDashboard();
</script>
</body>
</html>
